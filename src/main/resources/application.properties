spring.application.name=lreduca-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lr_educa_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Origem do frontend. Em desenvolvimento, o padrão é o servidor local do Live Server.
lreduca.cors.allowed-origin=${LR_EDUCA_FRONTEND_ORIGIN:http://127.0.0.1:5500}
